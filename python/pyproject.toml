[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-search-lite"
version = "1.0.0"
description = "Normalize Arabic text for search: remove diacritics and tatweel, unify alef, yaa, taa marbuta and hamza forms."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "dovmem" }]
requires-python = ">=3.8"
keywords = ["arabic", "search", "normalization", "diacritics", "nlp"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Natural Language :: Arabic",
  "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://dovmem.com/arabic-search"

[tool.setuptools]
packages = ["arabic_search_lite"]
